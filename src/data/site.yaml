# Что делаю — три карточки
whatDo:
  title: "Три уровня оклейки&nbsp;—<br>под разные задачи"
  aside: >-
    Каждый уровень отвечает на свою задачу: обозначить бренд, привлечь
    внимание на дороге или выстроить сильный визуальный образ. Сложность
    графики и ручной проработки определяет цену.
  cards:
    - num: "01"
      title: Брендинг авто
      text: "Лаконичный макет: логотип, контакты, сайт, QR. Машина становится узнаваемой и работает на репутацию."
    - num: "02"
      title: Рекламная оклейка
      text: "Привлекает внимание на дороге: услуги, продукт, акценты, призыв к действию. Такая оклейка продает, пока машина стоит в пробке или на парковке."
      featured: true
    - num: "03"
      title: Имиджевая концепция
      text: "Иллюстрации, коллажи, фотоматериалы — когда нужно построить сильный визуальный образ бренда на кузове."

# Тарифы — секция (массив самих тарифов в tiers.yaml)
pricing:
  title: "Три пакета<br>Сразу видно, что входит"
  aside: >-
    Три уровня сложности — от простого брендинга до полноценной рекламной
    концепции. Из каждого понятно, что входит и сколько занимает по времени.
  note: >-
    Не уверены, какой пакет нужен? Напишите задачу — подскажу за 5 минут,
    без обязательств.

# Портфолио — секция кейсов оклейки. Карточки строятся из cases.yaml,
# поэтому числа здесь не пишем: новый кейс появится в сетке сам.
cases:
  title: "Работы&nbsp;—<br>кейсы целиком"
  aside: >-
    Каждая оклейка разобрана на отдельной странице: с чем пришел клиент,
    как решалась задача и как выглядит макет под печать.
  ctaAll: "Смотреть все работы по оклейке"

# Процесс — 4 шага
process:
  title: "От брифа<br>до файла в&nbsp;мастерскую<br>по&nbsp;производству"
  aside: >-
    Понятные этапы и сроки. Без бесконечных согласований и сюрпризов
    в финальной цене.
  steps:
    - num: "01"
      title: Бриф
      text: "Марка и модель, что должно быть на машине, фирменный стиль, пожелания. 10 минут в Telegram."
    - num: "02"
      title: Концепция
      text: "2–3 направления макета с разной подачей. Выбираем рабочее, дорабатываем."
    - num: "03"
      title: Доработки
      text: "Уточняем по обратной связи: цвета, акценты, размеры, компоновка. До результата."
    - num: "04"
      title: Под печать
      text: "Финальный макет в нужном разрешении и формате. Файл — сразу в мастерскую по производству."

# E-E-A-T: кто отвечает за проект
founderSection:
  title: "Проект ведет<br>один дизайнер"
  aside: >-
    Без цепочки менеджеров: бриф, концепцию, правки и подготовку файла
    под печать ведет один человек, который отвечает за итоговый макет.
  name: Николай Ковтун
  role: "Графический дизайнер · Kovtun.studio"
  image: assets/nikolai.webp
  imageAlt: Николай Ковтун — графический дизайнер Kovtun.studio
  text: >-
    Я проектирую оклейку так, чтобы машина работала в реальной среде:
    читалась в потоке, не превращалась в шум и была понятна производству.
    В дизайне с 2010 года — начинал с упаковки и фирменного стиля, сейчас
    использую этот опыт и для оклейки: связываю бренд, рекламную задачу
    и технические ограничения кузова.
  stats:
    - num: "2010"
      label: "Год начала работы дизайнером"
    - num: "28"
      label: "Работ по оклейке в портфолио"
  personDescription: >-
    Николай Ковтун — графический дизайнер Kovtun.studio из Владивостока.
    С 2010 года разрабатывает упаковку, фирменный стиль, сайты, презентации
    и дизайн оклейки автомобилей для клиентов из разных городов России.
  knowsAbout:
    - Дизайн упаковки
    - Логотип и фирменный стиль
    - Веб-дизайн
    - Дизайн презентаций
    - Дизайн оклейки автомобиля
    - Брендинг коммерческого транспорта
    - Графический дизайн
  points:
    - num: "01"
      title: Личная ответственность
      text: "Вы общаетесь напрямую с дизайнером: меньше потерь в пересказе, быстрее решения и понятнее правки."
    - num: "02"
      title: Дизайн под дорогу
      text: "Проверяю, что логотип, контакты и рекламный акцент считываются на расстоянии, не только на экране."
    - num: "03"
      title: Файл для производства
      text: "Готовлю макеты с учетом печати, сторон автомобиля, припусков и требований подрядчика по оклейке."


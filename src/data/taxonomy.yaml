# taxonomy.yaml — два уровня каталога портфолио.
#
# directions — направления работ (порядок = нумерация 01…05 в каталоге).
#   Направление появляется в каталоге автоматически, когда у него
#   есть опубликованные кейсы. Пустые показываются
#   в списке направлений с пометкой «скоро».
#
# spheres — сферы бизнеса клиентов (второй уровень, для фильтра
#   и будущих сквозных подборок «все работы для одной сферы»).
#   В фильтр попадают только сферы, у которых есть кейсы или работы.

directions:
  - key: packaging
    label: Упаковка
  - key: identity
    label: Логотип и фирменный стиль
  - key: web
    label: Сайты
  - key: presentations
    label: Презентации
  - key: wrap
    label: Оклейка авто

# Сфер восемь: близкие отрасли объединены, чтобы фильтр и список на главной
# не рассыпались на сферы по одному кейсу. Сегмент кейса (segment в шапке)
# остается точным, а к сфере он привязан картой sphereBySegment в
# src/data/case-catalog.ts.
spheres:
  - key: food
    label: Продукты питания и агро
  - key: auto
    label: Автобизнес
  - key: production
    label: Производство и промышленность
  - key: engineering-systems
    label: Инженерные системы и умный дом
  - key: logistics-and-port
    label: Логистика и порт
  - key: real-estate
    label: Недвижимость
  - key: b2b-services
    label: Услуги для бизнеса и опт
  - key: wellness
    label: Отдых и велнес

# taxonomy.yaml — два уровня каталога портфолио.
#
# directions — направления работ (порядок = нумерация 01…05 в каталоге).
#   Направление появляется в каталоге автоматически, когда у него
#   есть кейсы (direction: <key> в cases.yaml). Пустые показываются
#   в списке направлений с пометкой «скоро».
#
# spheres — сферы бизнеса клиентов (второй уровень, для фильтра
#   и будущих сквозных подборок «все работы для одной сферы»).
#   В фильтр попадают только сферы, у которых есть работы.

directions:
  - key: packaging
    label: Упаковка
  - key: identity
    label: Логотип и фирменный стиль
  - key: web
    label: Сайты
  - key: presentations
    label: Презентации
  - key: wrap
    label: Оклейка авто

spheres:
  - key: food
    label: Производство питания
  - key: production
    label: Производство
  - key: industry
    label: Промышленный завод
  - key: metallurgy
    label: Металлургия
  - key: auto
    label: Автобизнес

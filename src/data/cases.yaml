    - title: Кузов = бумага
      text: "Металлик не закрашен: оклейка работает пятнами, как тушь на листе. Меньше пленки — выразительнее композиция."
    - title: Графика без швов
      text: "Иллюстрации переходят с борта на корму и крышку багажника непрерывно — машина смотрится целостно с любого ракурса."
    - title: Информация — блоками
      text: "Три телефона, услуги и соцсети сгруппированы в плашки, которые не спорят с иллюстрацией и читаются за пару секунд."

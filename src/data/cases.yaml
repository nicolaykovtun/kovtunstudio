# cases.yaml — кейсы студии.
# Каждая запись = страница /cases/<slug> + группа в каталоге /portfolio.
# Добавить кейс: запись здесь + project: <slug> у работ в gallery.yaml.
#
# Поля:
#   slug        — URL и ключ группировки (совпадает с project в gallery.yaml)
#   name        — короткое имя проекта (список кейсов, next-case)
#   accent      — цвет проекта для ключевых цифр и текстовых маркеров кейса
#   title       — H1 страницы кейса
#   seoTitle    — <title> страницы
#   seoDescription — meta description
#   category    — формат работы (термины с главной: брендинг / рекламная / имиджевая)
#   direction   — направление каталога (key из taxonomy.yaml → directions)
#   sphere      — чем занимается клиент (человеческий текст для страницы кейса)
#   sphereKey   — сфера бизнеса (key из taxonomy.yaml → spheres, для фильтра)
#   vehicles    — носители
#   cover       — id обложки (из gallery.yaml)
#   intro       — лид под заголовком
#   task        — «Задача»
#   solution    — «Решение»
#   moves       — приемы, 4 шт (сетка как «Процесс» на главной)
#   images      — порядок и подписи галереи кейса; wide: true = во всю ширину
#   result      — «Результат»


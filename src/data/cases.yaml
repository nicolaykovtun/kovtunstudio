    Серый металлик кузова оставлен фоном — как бумага в японской гравюре.
    Поверх — красное солнце и графика в технике суми-э: журавли, бамбук,
    пагода. Внутрь солнца вписан след автомобильного протектора —
    автомобильная тема, рассказанная языком гравюры. Логотип, телефоны

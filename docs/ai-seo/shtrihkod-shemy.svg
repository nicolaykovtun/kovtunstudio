<text x="98.0" y="262.8" font-size="12" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 98.0 262.8)">22,85 — высота штрихов</text>
<text x="120.0" y="455.0" font-size="14" fill="#8a8a8a" text-anchor="start" font-weight="400">Серые поля — свободные зоны.</text>
<text x="120.0" y="477.0" font-size="14" fill="#8a8a8a" text-anchor="start" font-weight="400">Они входят в размер символа, занимать их нельзя ничем.</text>
<text x="620.0" y="166.0" font-size="17" fill="#111111" text-anchor="start" font-weight="600">Что резервируем в макете</text>
<text x="620.0" y="198.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">100%  —  37,29 × 25,93 мм</text>
<text x="620.0" y="222.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">80%  —  29,83 × 20,74 мм, это минимум</text>
<text x="620.0" y="246.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">модуль X при 100%  —  0,33 мм</text>
<text x="620.0" y="270.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">масштаб  —  от 80 до 200%</text>
<text x="620.0" y="316.0" font-size="17" fill="#D91620" text-anchor="start" font-weight="600">Что лезет в зоны на практике</text>
<text x="620.0" y="342.0" font-size="14" fill="#8a8a8a" text-anchor="start" font-weight="400">рамка этикетки, соседний блок текста,</text>
<text x="620.0" y="362.0" font-size="14" fill="#8a8a8a" text-anchor="start" font-weight="400">знак EAC, фон с рисунком или текстурой</text>

<text x="60.0" y="594.0" font-size="22" fill="#111111" text-anchor="start" font-weight="600">2. Что теряется, если подрезать высоту кода</text>
<text x="60.0" y="618.0" font-size="14" fill="#8a8a8a" text-anchor="start" font-weight="400">Стандарт держит высоту 22,85 мм ради запаса на чтение под углом. Подрезанный код обычно считывается, но запас уходит.</text>

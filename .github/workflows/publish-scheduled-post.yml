name: Publish scheduled blog post

# Отложенная публикация статьи блога. Работает на серверах GitHub,
# компьютер Николая для этого не нужен и может быть выключен.
#
# Что делает в день публикации:
#   1. снимает draft: true со статьи и дописывает строку в public/llms.txt
#      (скрипт docs/tools/publish-blog-post.cjs, тот же, что запускается вручную)
#   2. коммитит изменение от имени github-actions
#   3. собирает сайт и выкатывает его на Pages
#
# Деплой сделан прямо здесь, а не через deploy.yml: пуш, сделанный
# встроенным GITHUB_TOKEN, намеренно не запускает другие workflow,
# иначе получилась бы рекурсия.
#
# Ручной запуск доступен в любой момент: вкладка Actions, кнопка Run workflow,
# поле slug. Дату при ручном запуске не проверяем.

on:
  schedule:
    # 00:00 UTC 17 августа = 10:00 во Владивостоке.
    # Cron у GitHub повторяется каждый год, поэтому ниже стоит проверка даты.
    - cron: '0 0 17 8 *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug статьи в src/content/blog (без .md)'
        required: true
        default: 'chto-dolzhno-byt-na-etiketke'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  POST_SLUG: ${{ github.event.inputs.slug || 'chto-dolzhno-byt-na-etiketke' }}
  PUBLISH_DATE: '2026-08-17'

jobs:
  publish:
    name: Unset draft, commit, build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверка даты (только для запуска по расписанию)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" != "$PUBLISH_DATE" ]; then
            echo "Сегодня $(date -u +%F), а публикация назначена на $PUBLISH_DATE. Выходим."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Снять черновик и дописать llms.txt
        if: steps.gate.outputs.run == 'true'
        run: node docs/tools/publish-blog-post.cjs "$POST_SLUG"

      - name: Коммит
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Изменений нет, статья уже опубликована. Пересоберем и выкатим как есть."
          else
            git add -A
            git commit -m "Публикация статьи блога: $POST_SLUG"
            git push
          fi

      - name: Сборка
        if: steps.gate.outputs.run == 'true'
        uses: withastro/action@v3
        with:
          node-version: 22

      - name: Деплой на Pages
        if: steps.gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish scheduled blog post

# Отложенная публикация статей блога. Работает на серверах GitHub,
# компьютер Николая для этого не нужен и может быть выключен.
#
# Расписание читает шапки статей, а не константу в этом файле. Раз в сутки
# workflow берет все черновики из src/content/blog, у которых pubDate уже
# наступила по UTC, снимает у них draft: true, дописывает строки в
# public/llms.txt (скрипт docs/tools/publish-blog-post.cjs), коммитит,
# собирает сайт и выкатывает его на Pages.
#
# Чтобы статья вышла в нужный день, достаточно поставить ей pubDate и
# оставить draft: true. Править этот файл под каждую статью не нужно.
#
# Деплой сделан прямо здесь, а не через deploy.yml: пуш, сделанный
# встроенным GITHUB_TOKEN, намеренно не запускает другие workflow,
# иначе получилась бы рекурсия.
#
# Ручной запуск доступен в любой момент: вкладка Actions, кнопка Run workflow.
# Поле slug публикует конкретную статью, не глядя на дату. Пустое поле — тот же
# разбор по датам, что и по расписанию.

on:
  schedule:
    # 00:00 UTC = 10:00 во Владивостоке. Каждый день.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug статьи в src/content/blog (без .md). Пусто — все статьи с наступившей pubDate'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Unset draft, commit, build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Снять черновик и дописать llms.txt
        run: node docs/tools/publish-blog-post.cjs "${SLUG:---due}"
        env:
          SLUG: ${{ github.event.inputs.slug }}

      # Ежедневный запуск не должен пересобирать и перевыкатывать сайт впустую:
      # если снимать было нечего, по расписанию выходим. Ручной запуск собирает
      # и выкатывает в любом случае — это кнопка «выложить сейчас».
      - name: Есть ли что публиковать
        id: gate
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "Изменений нет, публиковать нечего. Выходим."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "Изменений нет, но запуск ручной. Пересоберем и выкатим как есть."
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Коммит
        if: steps.gate.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Публикация статей блога по расписанию"
          git push

      - name: Сборка
        if: steps.gate.outputs.deploy == 'true'
        uses: withastro/action@v3
        with:
          node-version: 22

      - name: Деплой на Pages
        if: steps.gate.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

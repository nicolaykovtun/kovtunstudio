# Раскладка изображений кейса. Пути в full/ и thumb/ строятся из имени файла:
# full/<file>.webp и thumb/<file>-thumbnail.webp внутри assetRoot.
assetRoot: /assets/cases/identity-trubovarnya

cover:
  src: trubovarnya-identity-cover.webp
  alt: Обложка гайдбука Трубоварни Еремеевой с логотипом и сигнальной лентой

og: trubovarnya-identity-cover.webp
ogAlt: Гайдбук по фирменному стилю Трубоварни Еремеевой

keywords: фирменный стиль, логотип, гайдбук, брендбук, монтаж систем отопления, Трубоварня Еремеева, Руза, Николай Ковтун

resultTitle: Что дает такая система

ctaTitle: Нужен стиль, который применят без вас?
ctaText: >-
  Расскажите, где будет жить знак: печать, спецовка, техника, сайт. Соберу
  систему и опишу правила так, чтобы их исполнили без дизайнера.
ctaButton: Обсудить фирменный стиль

groups:
  - id: logo
    title: Логотип и пять исполнений
    # Файлы знака вертикальные, 960x1080: в tall они видны целиком и почти
    # без полей.
    layout: tall
    intro: >-
      Шестерня, кулак с газовым ключом и сигнальная лента. Под каждый тип фона
      готов свой файл, поэтому знак не приходится переделывать под носитель.
    items:
      - file: trubovarnya-logo-01-main
        label: Основной вариант знака
      - file: trubovarnya-logo-02-on-yellow
        label: На светлом цветном фоне
      - file: trubovarnya-logo-03-on-navy
        label: На темном фоне
      - file: trubovarnya-logo-04-mono-light
        label: Одноцветный вариант для темного фона
      - file: trubovarnya-logo-05-mono-dark
        label: Одноцветный вариант для светлого фона

  - id: guidebook
    title: Гайдбук
    # Страницы гайдбука ровно 16:9 — в раскладке слайдов они видны целиком
    # и без полей, тогда как автоматический tall ужал бы их до половины плитки.
    layout: slides
    intro: >-
      В гайдбуке 8 страниц и четыре раздела: конструкция логотипа, колористика,
      типографика, деловая документация. Здесь шесть страниц — разворот
      с визитной карточкой не публикуем, на нем личные данные владельца.
    items:
      - file: trubovarnya-guidebook-01-cover
        label: Обложка руководства по фирменному стилю
      - file: trubovarnya-guidebook-02-safe-area
        label: Охранное поле по высоте буквы «Б»
      - file: trubovarnya-guidebook-03-versions
        label: Цветные и монохромные исполнения знака
      - file: trubovarnya-guidebook-04-misuse
        label: Девять недопустимых вариантов
      - file: trubovarnya-guidebook-05-colors
        label: "Палитра: Pantone, CMYK и HEX"
      - file: trubovarnya-guidebook-06-type
        label: Шрифтовая пара и размеры заголовков

related:
  title: Часть комплексной работы
  intro: >-
    Знак и правила были первым шагом. По палитре и шрифтовой паре из гайдбука
    собран сайт компании — желтый и темно-синий на страницах взяты отсюда,
    а не подобраны заново.
  items:
    - slug: website-trubovarnya
      label: Сайт
      text: Шесть страниц, семь блоков главной и вайрфреймы, согласованные до дизайна.

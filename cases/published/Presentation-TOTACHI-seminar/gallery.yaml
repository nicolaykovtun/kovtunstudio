resultTitle: Что дал ролик вместо спикера
resultIntro: >-
  Историю компании партнерам рассказывают на каждом семинаре, и обычно это слайды
  с кликером. Здесь десять минут отдали ролику с диктором, анимацией и звуком.

ctaTitle: Нужна презентация, которая выступит за вас?
ctaText: >-
  Расскажите, где и перед кем выступаете и что уже есть из материалов. Соберу
  презентацию в вашем шаблоне и ролик с диктором под нее: срок и состав работ
  назову после первого разговора.
ctaButton: Обсудить видеопрезентацию

groups:
  - id: clips
    theme: dark
    title: Восемь фрагментов ролика
    # Клипы 16:9 со звуком, по четыре в ряд. Внутренних цифр компании в кадрах нет.
    layout: slides
    ratio: 16 / 9
    intro: >-
      Отрезки из ролика на 9 минут 57 секунд. Логотип проявляется на обложке,
      счетчик года и пункты встают по словам диктора, карточки брендов и фото
      появляются в ритме озвучки. Звук включен: в каждом фрагменте слышно диктора
      и музыку.
    items:
      - file: totachi-01-oblozhka
        label: Обложка, 17 секунд. Видео замирает и темнеет, проявляется логотип, заголовок поднимается строками
        video: true
      - file: totachi-02-1996
        label: С 1996 года, 10 секунд. Счетчик года и пункты появляются на словах диктора
        video: true
      - file: totachi-03-foto
        label: Фото появляются по очереди, 5 секунд
        video: true
      - file: totachi-04-istoriya
        label: История компании, 26 секунд. Стрелка периодов, годы и события встают по голосу
        video: true
      - file: totachi-05-holdingi
        label: Мировые холдинги, 20 секунд. Карточки партнеров
        video: true
      - file: totachi-06-brendy
        label: Бренды, 21 секунда. TOTACHI с мерцанием, следом остальные бренды компании
        video: true
      - file: totachi-07-sport
        label: Дрифт и ралли, 18 секунд. Фото с соревнований колонками
        video: true
      - file: totachi-08-final
        label: Финал, 19 секунд. Пункты появляются на словах
        video: true

  - id: storyboard
    theme: paper
    title: Как собирается слайд, кадр за кадром
    # Кадры сняты из самого ролика (ffmpeg, E:\Temp\totachi-frames.ps1):
    # первые и последние слайды по четыре момента, 16:9, по четыре в ряд.
    layout: slides
    ratio: 16 / 9
    intro: >-
      Так выглядит один слайд во времени. Claude сначала присылал раскадровку
      с такими моментами и собирал ролик только после утверждения. Обложка:
      фото приближается, проявляется логотип, строки заголовка поднимаются
      снизу вверх, каждая на свое слово диктора. Финал: пункты появляются
      по одному, пока диктор их называет.
    items:
      - file: totachi-sb-01-a
        label: Обложка, 1 секунда. Старт сцены, фото медленно приближается
      - file: totachi-sb-01-b
        label: Обложка, 2,8 секунды. Проявляется логотип МСМ ГРУПП 30 лет
      - file: totachi-sb-01-c
        label: Обложка, 5,6 секунды. Первые строки заголовка встали на свое слово
      - file: totachi-sb-01-d
        label: Обложка, 9,5 секунды. Полный заголовок и подзаголовок с годом
      - file: totachi-sb-16-a
        label: Финал, первый пункт появляется на слове диктора
      - file: totachi-sb-16-b
        label: Финал, второй пункт
      - file: totachi-sb-16-c
        label: Финал, третий и четвертый пункты
      - file: totachi-sb-16-d
        label: Финал, последний кадр ролика перед затуханием музыки


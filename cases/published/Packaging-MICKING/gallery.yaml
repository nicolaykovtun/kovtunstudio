# Раскладка изображений кейса. Пути строятся из имени файла:
# full/<file>.webp и thumb/<file>-thumbnail.webp внутри assetRoot.
# Исходники: cases/unpublished/MICKING/Oil. Банки серий вырезаны из сводных
# рендеров по отдельности и приведены к одной высоте — иначе в сетке они стоят
# в разном масштабе.
assetRoot: /assets/cases/brand-micking

cover:
  src: micking-cover.webp
  alt: Четыре серии моторных масел MICKING, металлические банки 4 литра и канистры 1 литр

og: micking-cover.webp
ogAlt: Линейка моторных масел MICKING после ребрендинга

keywords: дизайн упаковки, брендинг моторного масла, дизайн этикетки, металлическая банка, линейка SKU, пробная печать, MICKING, МСМ ГРУПП, Владивосток, Николай Ковтун

resultTitle: Что дал ребрендинг

ctaTitle: Нужна упаковка, которая выдержит рост линейки?
ctaText: >-
  Расскажите, сколько видов и фасовок планируется и где печатаете тару. Соберу
  систему так, чтобы новый продукт вставал на готовую сетку, а цвет на пробной
  печати совпал с макетом.
ctaButton: Обсудить дизайн упаковки

compare:
  title: Что было и что стало
  intro: >-
    Корейский дизайн MICKING не обновлялся 20 лет: диагональный логотип, черные
    и цветные плашки, серый пластик. Для российского рынка бренд собрали заново
    вокруг белого поля, черного логотипа и цветного штриха.
  items:
    - number: '01'
      title: Этикетка четырехлитровой банки
      text: >-
        В старом дизайне работали плашки и наклонная надпись во всю высоту:
        читать этикетку приходилось по частям. В новом порядок задает сетка,
        логотип стоит горизонтально, а линейку и назначение продукта показывает
        цвет штриха.
      before: micking-old-01-etiketka
      beforeAlt: Корейская этикетка MICKING Gold Top+ 5W-30 до ребрендинга
      beforeCaption: Корейский дизайн, до 2022 года
      after: micking-new-01-etiketka
      afterAlt: Новая этикетка MICKING Diesel Oil 15W-40 с фирменным штрихом
      afterCaption: Новый дизайн
    - number: '02'
      title: Канистра один литр
      text: >-
        Серый пластик и оранжевая наклейка уступили место белой канистре с тем
        же набором элементов, что и на металлической банке. Банка и канистра
        одного продукта теперь читаются как одна пара.
      before: micking-old-02-kanistra
      beforeAlt: Старая канистра MICKING Max Super+ из серого пластика
      beforeCaption: Корейский дизайн, до 2022 года
      after: micking-new-02-kanistra
      afterAlt: Новая канистра MICKING Gasoline Oil 0W-20 один литр
      afterCaption: Новый дизайн

groups:
  - id: series
    # Макеты на белом фоне: секцию тоже делаем светлой.
    theme: paper
    title: Серии в двух фасовках
    # slides дает 4 колонки: четыре серии встают одним рядом, а не 3 + 1.
    layout: slides
    ratio: 4 / 3
    intro: >-
      У каждой серии свой цвет штриха: красный у бензиновых масел, зеленый у
      дизельных, малиновый у трансмиссионных, голубой у трансмиссионных для
      мостов. Банка 4 литра и канистра 1 литр собраны по одной схеме, поэтому в
      ряду на полке продукт узнается по цвету раньше, чем читается название.
    items:
      - file: micking-series-01-gasoline
        label: Gasoline Oil, бензиновая серия MG1
      - file: micking-series-02-diesel
        label: Diesel Oil, дизельная серия PRO1
      - file: micking-series-03-atf
        label: ATF Ultra LV, трансмиссионная серия MATF
      - file: micking-series-04-gear
        label: Gear Oil, трансмиссионная серия MTR

  - id: cans
    # Макеты на белом фоне: секцию тоже делаем светлой.
    theme: paper
    title: Двадцать восемь видов масла
    # slides — 4 колонки на десктопе, 2 на планшете и телефоне. Только slides,
    # tall и screens сбрасывают базовое «grid-column: span 6»; с portrait каждая
    # банка растягивается на всю строку, и страница вырастает до 40 000 пикселей.
    layout: slides
    ratio: 425 / 460
    intro: >-
      Вся линейка на одной сетке. Постоянными остаются логотип, разметка и
      служебные блоки; меняются название линейки, вязкость, допуски и цвет
      штриха. Отсюда и скорость масштабирования: новый вид собирается на готовом
      эталоне за считанные часы.
    items:
      - file: micking-can-mg1-0
        label: Gasoline Oil 0W-20, серия MG1
      - file: micking-can-mg1-1
        label: Gasoline Oil 5W-30, серия MG1

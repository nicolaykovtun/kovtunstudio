  - id: flat
    # Макеты на белом фоне: секцию тоже делаем светлой.
    theme: paper
    title: Плоские макеты под печать
    # sheet — одна колонка во всю ширину. Развертка длинная, в сетке из трех
    # колонок мелкий текст на этикетке не прочитать. ratio не задаем: sheet
    # показывает картинку целиком, по ее собственной пропорции.
    layout: sheet
    intro: >-
      Развертка банки: лицевая сторона, две боковые и оборот. Слева название
      линейки и вязкость, справа состав и предупреждения на русском и
      английском, снизу служебная полоса с данными изготовителя и импортера.
      Штрих проходит по всей развертке и на готовой банке замыкается по кругу.
    items:
      - file: micking-flat-01-gasoline
        label: Развертка банки Gasoline Oil 0W-16 с разметкой
      - file: micking-flat-02-diesel
        label: Развертка банки Diesel Oil 15W-40
      - file: micking-flat-03-banki-4l
        label: Готовые банки 4 литра, лицевая и боковые стороны

  - id: shelf
    # Макеты на белом фоне: секцию тоже делаем светлой.
    theme: paper
    title: Полка, на которой предстояло выделиться
    # Один кадр во всю ширину: на мелкой плитке банки конкурентов не различить.
    layout: sheet
    intro: >-
      Каждый вариант дизайна мы ставили в этот ряд и смотрели, как он держится
      рядом с соседями по магазину. Сравнение вошло в презентацию руководству.
      У большинства японских и корейских масел белый или светлый металл, крупная
      типографика и один яркий акцент, поэтому выигрывает самый ясный дизайн.
    items:
      - file: micking-process-01-konkurenty
        label: 'Полка конкурентов: ENEOS, Totachi, Idemitsu, Kixx, ZIC'

  - id: process
    # Макеты на белом фоне: секцию тоже делаем светлой.
    theme: paper
    title: Что поправило производство
    # screens — ровно три колонки под три кадра, без висящего четвертого.
    layout: screens
    ratio: 3 / 2
    intro: >-
      Отвергнутый вариант с плашкой, схема крышек и бочка, которая не прошла по
      технологии. Часть решений в упаковке принимает не дизайнер, а печатная
      машина и объем партии.
    items:
      - file: micking-process-02-variant
        label: 'Один из ранних вариантов: цветная плашка вместо штриха'
      - file: micking-process-03-kryshki
        label: 'Схема крышек для литровых банок: 12 цветов свели к трем'
      - file: micking-process-04-bochka
        label: Смелая версия бочки 200 литров, которую не потянула технология


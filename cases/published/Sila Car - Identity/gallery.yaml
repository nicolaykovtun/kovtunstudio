# Раскладка изображений кейса. Пути в full/ и thumb/ строятся из имени файла:
# full/<file>.webp и thumb/<file>-thumbnail.webp внутри assetRoot.
assetRoot: /assets/cases/identity-sila-car

cover:
  src: sila-car-identity-cover.webp
  alt: Обложка гайдбука Sila Car с красным спорткаром и наклонной рамкой

og: sila-car-identity-cover.webp
ogAlt: Гайдбук по фирменному стилю Sila Car

keywords: фирменный стиль, логотип, гайдбук, автобизнес, автомобили с аукционов Японии, Sila Car, Владивосток, Николай Ковтун

resultTitle: Как знак превратился в систему
resultIntro: >-
  Носители расходятся по формату от аватарки в соцсетях до баннера 3000×1500 мм, а знак
  должен читаться и в одну краску. Поэтому стиль собран как система исполнений и сеток, а
  не как одна композиция, которую каждый раз пересобирают заново.

ctaTitle: Нужен стиль, который работает от аватарки до борта?
ctaText: >-
  Расскажите, где будет жить знак: экран, печать, вывеска, транспорт. Подготовлю
  исполнения под разные фоны и запишу правила так, чтобы подрядчики не
  пересобирали стиль заново.
ctaButton: Обсудить логотип и гайдбук

groups:
  - id: logo
    title: Логотип и пять исполнений
    # Исходный лист 5335x3334 состоит из пяти карточек 4:5. Они нарезаются
    # отдельно в tmp/crop-sila-car.mjs и сохраняют одинаковый масштаб знака.
    layout: tall
    ratio: 4 / 5
    intro: >-
      Красный спорткар выходит за наклонную рамку, а двухстрочная надпись
      уравновешивает подробную иллюстрацию. Для каждого типа фона есть готовое
      исполнение — полноцветное или одноцветное.
    items:
      - file: sila-car-logo-01-main
        label: Основной вариант на белом фоне
      - file: sila-car-logo-02-on-red
        label: Цветной вариант на красном фоне
      - file: sila-car-logo-03-on-gray
        label: Цветной вариант на сером фоне
      - file: sila-car-logo-04-mono-light
        label: Одноцветный вариант для черного фона
      - file: sila-car-logo-05-mono-dark
        label: Одноцветный вариант для белого фона

  - id: guidebook
    title: Гайдбук
    # Все страницы 16:9. Показываем первые шесть: страница 7 содержит телефоны
    # и адрес, страница 8 — только финальную благодарность.
    layout: slides
    intro: >-
      В восьмистраничном документе описаны фирменный блок, охранное поле,
      исполнения, четыре цвета, Helvetica Neue и правила верстки носителей.
      Здесь шесть содержательных страниц без телефонов и адреса.
    items:
      - file: sila-car-guidebook-01-cover
        label: Обложка руководства по фирменному стилю
      - file: sila-car-guidebook-02-safe-area
        label: Фирменный блок, знак, логотип и охранное поле
      - file: sila-car-guidebook-03-versions
        label: Цветные и монохромные исполнения
      - file: sila-car-guidebook-04-colors
        label: "Палитра: Pantone, CMYK и HEX"
      - file: sila-car-guidebook-05-type
        label: Четыре начертания Helvetica Neue
      - file: sila-car-guidebook-06-banner
        label: Баннер 3000×1500 мм и модульная сетка

related:
  title: Знак в движении
  intro: >-
    Фирменный спорткар не остался картинкой в гайдбуке. В оклейке Toyota
    Probox он увеличен до главного героя борта, а черный, белый и красный
    собирают автомобиль в ту же визуальную систему.
  items:
    - slug: sila-car
      label: Оклейка авто
      text: Toyota Probox с фирменным спорткаром, соцсетями и макетом под печать.

resultTitle: Что дает такая страница

ctaTitle: Продаете то, чего клиент еще не видел?
ctaText: >-
  Расскажите, из чего состоит ваша программа и чего боятся те, кто идет впервые.
  Посмотрю, какие блоки должны закрыть эти вопросы до звонка.
ctaButton: Обсудить лендинг

compare:
  title: Как схема превращалась в дизайн
  intro: >-
    Порядок блоков и тексты согласовали на вайрфрейме, поэтому спорные места
    правились на схеме. Слева вайрфрейм, справа готовый макет.
  items:
    - number: '01'
      title: Первый экран остался в том же порядке
      text: >-
        На схеме проверяли последовательность: заголовок, обещание, две кнопки,
        таймер до старта, кадр под фотографию. В дизайне место под картинку занял
        снимок круга у костра, фоном встала ночная тайга — порядок не поменялся,
        диагональ на границе с песочным фоном была задумана еще на схеме.
      before: kuznitsa-wireframe-01-hero
      after: kuznitsa-landing-01-hero
      beforeAlt: Вайрфрейм первого экрана лендинга «Кузница души»
      afterAlt: Готовый дизайн первого экрана с ночной тайгой и кадром у костра
    - number: '02'
      title: Карточки подняли на оранжевую подложку
      text: >-
        Четыре карточки о том, что происходит в круге, стоят квадратом: снимок
        сверху, заголовок, два предложения. В дизайне под каждую ушла оранжевая
        подложка, а текст стал белым — карточки отделились от песочного фона
        без единой рамки.
      before: kuznitsa-wireframe-02-about
      after: kuznitsa-landing-02-about
      beforeAlt: Вайрфрейм блока из четырех карточек о мужском круге
      afterAlt: "Готовый дизайн блока: четыре карточки на оранжевой подложке"
    - number: '03'
      title: Обещание в блоке о цене переписали на «ты»
      text: >-
        На схеме надпись рядом с составом стоимости читалась «Полный комплект
        для вашего комфорта и безопасности». В дизайне она стала «Полный комплект
        для настоящего мужского отдыха» и получила рядом костер. Обращение
        на «ты» тут сошлось с остальной страницей — «Что ты получишь», «Ты готов».
      before: kuznitsa-wireframe-06-included
      after: kuznitsa-landing-06-included
      beforeAlt: Вайрфрейм блока «Стоимость программы охватывает» из пяти групп
      afterAlt: Готовый дизайн блока о составе стоимости с костром и надписью о мужском отдыхе
    - number: '04'
      title: Вопрос над формой стал утверждением
      text: >-
        На схеме темная секция звалась «Ты готов стать сильнее?» — вопросом.
        В дизайне знак сменился на восклицательный, а серая заливка — на кадр
        вечернего стойбища. Форма осталась той же: имя, почта, телефон
        и одна кнопка.
      before: kuznitsa-wireframe-08-form
      after: kuznitsa-landing-08-form
      beforeAlt: Вайрфрейм темной секции с формой записи из трех полей
      afterAlt: Готовый дизайн секции с формой записи на фоне вечернего стойбища


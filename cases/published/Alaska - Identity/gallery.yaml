# Раскладка изображений кейса. Пути в full/ и thumb/ строятся из имени файла:
# full/<file>.webp и thumb/<file>-thumbnail.webp внутри assetRoot.
assetRoot: /assets/cases/identity-alaska

cover:
  src: alaska-identity-cover.webp
  alt: Новый логотип Alaska белым по фирменному синему — полигональный медведь на горе и надпись ALASKA

og: alaska-identity-cover.webp
ogAlt: Обновленный логотип аккумуляторов Alaska в инверсном исполнении

keywords: логотип, ребрендинг знака, фирменный стиль, аккумуляторы, Alaska, Аляска, МСМ ГРУПП, полигональная графика, Николай Ковтун

resultTitle: Что дает такой знак
resultIntro: >-
  Знак живет в двух крайностях сразу: на этикетке аккумулятора он размером
  с ноготь, на рекламном баннере — в человеческий рост. Правки шли ровно
  под эту вилку, поэтому проверка каждого шага была одна: читается ли форма,
  когда картинку уменьшили до превью маркетплейса.

ctaTitle: Нужен знак, который выдержит и этикетку, и баннер?
ctaText: >-
  Расскажите, где будет жить логотип: упаковка, печать, вывеска, реклама.
  Соберу знак и правила так, чтобы его ставили без дизайнера.
ctaButton: Обсудить логотип

compare:
  title: Было и стало
  intro: >-
    Слева знак, с которым бренд жил до редизайна, справа — итог пяти шагов.
    Медведь, гора и наклон надписи остались на месте: узнавание не ломали.
  items:
    - number: '01'
      title: Тот же силуэт, другая графика
      text: >-
        Старый знак собран из штриховой прорисовки: у медведя проработана шерсть,
        у гор — тонкие засечки скал, надпись стоит на курсивном гротеске
        с полосками-отбивками по краям. В мелком размере штрих слипался,
        а полоски читались грязью. Новый знак набран плоскостями, надпись
        выпрямлена по направляющим и скруглена, цвет ушел из красного
        в темно-синий под северное название бренда.
      before: alaska-logo-01-original
      after: alaska-logo-07-step5
      beforeAlt: Старый логотип Alaska красным цветом с рисованным медведем и горами
      afterAlt: Новый логотип Alaska темно-синим с полигональным медведем на горе
      beforeCaption: Знак / до
      afterCaption: Знак / после

groups:
  - id: steps
    title: Пять шагов и подготовка к ним
    # Все файлы приведены к одному холсту 16:9, поэтому раскладка слайдов
    # показывает их целиком и без полей: в tall знак ужимался до половины плитки.
    layout: slides
    intro: >-
      Знак правился по частям. Сначала разобрали и выпрямили надпись, потом дали
      ей скругления, потом цвет, и только после этого взялись за медведя.
      Так на каждом шаге было видно, что именно изменилось.
    items:
      - file: alaska-logo-01-original
        label: Знак до редизайна
      - file: alaska-logo-02-guides
        label: Разбор наклонов по направляющим
      - file: alaska-logo-03-step1
        label: Шаг 1. Надпись выпрямлена, отбивки убраны
      - file: alaska-logo-04-step2
        label: Шаг 2. Углы и внутренние вырезы скруглены
      - file: alaska-logo-05-step3
        label: Шаг 3. Надпись в новом темно-синем
      - file: alaska-logo-06-step4
        label: Шаг 4. Медведь и гора в полигональной графике
      - file: alaska-logo-07-step5
        label: Шаг 5. Медведь и надпись сведены в один лок-ап
      - file: alaska-logo-08-rules
        label: Правила использования — четыре варианта на белом и на синем

  - id: carriers
    title: Знак на носителях
    layout: slides
    intro: >-
      Четыре размера, на которых знак проверялся: этикетка аккумулятора,
      развертка коробки, рекламный баннер и верхняя наклейка на крышку.
      На баннере работает инверсия из правил — белый знак поверх фотографии.
    items:
      - file: alaska-carrier-01-label
        label: Этикетка серии AGM
      - file: alaska-carrier-02-box
        label: Развертка коробки серии CMF
      - file: alaska-carrier-03-banner
        label: Рекламный баннер с инверсией знака
      - file: alaska-carrier-04-top
        label: Верхняя наклейка на крышку аккумулятора

related:
  title: Часть комплексной работы
  intro: >-
    Знак был первым шагом. Дальше на нем собрана вся упаковка линейки: логотип
    стоит в левом верхнем углу каждой этикетки и каждой коробки, а полигональная
    манера медведя задала манеру гор на этикетках.
  items:
    - slug: packaging-alaska
      label: Упаковка
      text: 37 позиций, три серии, одна сетка этикетки и коробки под каждую позицию.

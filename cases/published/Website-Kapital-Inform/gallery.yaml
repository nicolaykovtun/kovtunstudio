compare:
  title: Как схемы превращались в дизайн
  intro: >-
    Порядок блоков и тексты согласовали на вайрфреймах, поэтому в дизайне
    менялась подача, а не структура. Слева схема, справа готовый макет.
  items:
    - number: '01'
      title: Первый экран не поменял порядок
      text: >-
        На схеме проверяли порядок: заголовок, обещание, две кнопки и список
        услуг строкой. В дизайне серый прямоугольник стал фотографией под
        красной заливкой, а желтая диагональ подхватила цвет логотипа.
      before: kapital-wireframe-01-hero
      after: kapital-home-01-hero
      beforeAlt: Вайрфрейм первого экрана сайта Капиталъ Информ
      afterAlt: Готовый дизайн первого экрана сайта Капиталъ Информ
    - number: '02'
      title: Карточка услуги получила иконку вместо картинки
      text: >-
        В схеме у каждой из шести услуг стояла заглушка под изображение.
        В дизайне ее заменила линейная иконка: карточки стали легче, а название
        и описание вышли на первый план.
      before: kapital-wireframe-03-services
      after: kapital-home-03-services
      beforeAlt: Вайрфрейм блока ключевых услуг
      afterAlt: Готовый дизайн блока ключевых услуг с иконками
    - number: '03'
      title: Семь причин стали нумерованной сеткой
      text: >-
        Схема задала неравные карточки: первая причина крупнее остальных.
        В дизайне номера 01–07 набраны красным поверх обесцвеченных фотографий,
        поэтому блок читается как список, а не как галерея.
      before: kapital-wireframe-05-why
      after: kapital-home-05-why
      beforeAlt: Вайрфрейм блока причин выбрать компанию
      afterAlt: Готовый дизайн блока с семью причинами и крупными номерами
    - number: '04'
      title: Сторону компании выделили карточкой
      text: >-
        На схеме это два одинаковых списка на белом фоне. В дизайне левая
        колонка ушла в серую рамку, правая встала на белую карточку с тенью
        и красным заголовком — сторона компании читается первой.
      before: kapital-wireframe-07-versus
      after: kapital-home-07-versus
      beforeAlt: Вайрфрейм блока сравнения бухгалтеров
      afterAlt: Готовый дизайн блока сравнения с выделенной колонкой компании


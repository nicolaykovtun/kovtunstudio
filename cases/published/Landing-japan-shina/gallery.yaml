resultTitle: Что дает такая структура
resultIntro: >-
  Компания продает на маркетплейсах, держит магазин и шиномонтаж и возит шины с японских
  аукционов, а на старом сайте эти направления не складывались в одну картину. Покупатель
  при этом редко знает типоразмер своей машины.

ctaTitle: Нужен сайт, который объясняет ваш товар?
ctaText: Пришлите ссылку на текущий сайт или расскажите про товар и услуги. Посмотрю, что мешает покупателю дойти до заявки.
ctaButton: Обсудить сайт

compare:
  title: Как схемы превращались в дизайн
  intro: >-
    Структуру и тексты согласовали на вайрфреймах, поэтому спорные места
    правились на схемах. Слева вайрфрейм, справа готовый макет.
  items:
    - number: '01'
      title: Первый экран получил фокус
      text: >-
        На схеме проверяли порядок: заголовок, обещание, кнопка, четыре цифры
        о компании. В дизайне добавились фотография шины и красный акцент,
        порядок остался прежним.
      before: japan-shina-wireframe-01-hero
      after: japan-shina-home-01-hero
      beforeAlt: Вайрфрейм первого экрана сайта Japan Шина
      afterAlt: Готовый дизайн первого экрана сайта Japan Шина
    - number: '02'
      title: Рассказ о компании собран в один блок
      text: >-
        Текст о поставках, карта магазина и четыре показателя стоят рядом.
        В дизайне блок ушел на темную подложку и отделился от остальной страницы.
      before: japan-shina-wireframe-02-about
      after: japan-shina-home-02-about
      beforeAlt: Вайрфрейм блока о компании
      afterAlt: Готовый дизайн блока о компании на темной подложке
    - number: '03'
      title: Карточка товара стала одинаковой для всех разделов
      text: >-
        Бренд, страна, характеристики и отметки о сезоне заняли фиксированные
        места. Одна карточка работает для летних шин, зимних и дисков.
      before: japan-shina-wireframe-04-catalog-summer
      after: japan-shina-home-04-catalog-summer
      beforeAlt: Вайрфрейм раздела летних шин
      afterAlt: Готовый дизайн раздела летних шин с карточками товара
    - number: '04'
      title: Шиномонтаж показан как отдельная услуга
      text: >-
        Услуги, аргументы, адрес, часы работы и карта собраны в один блок,
        чтобы человек мог записаться, не уходя со страницы.
      before: japan-shina-wireframe-08-service
      after: japan-shina-home-08-service
      beforeAlt: Вайрфрейм блока шиномонтажа
      afterAlt: Готовый дизайн блока шиномонтажа с картой проезда


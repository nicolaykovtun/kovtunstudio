  - id: forms
    title: Три формы подбора
    # Модалки чуть разной высоты: 0,850, 0,827 и 0,814 по отношению ширины
    # к высоте. Плитку держим в 5:6 — это середина разброса, каждая картинка
    # заполняет ее целиком, срез не больше 1,2% по краю. В штатных 4:5
    # оставались серые поля.
    ratio: 5 / 6
    intro: >-
      Покупатель редко знает типоразмер. Поэтому подбор разложен на два
      сценария, а сложные вопросы уходят в техподдержку.
    items:
      - file: japan-shina-modal-01-by-car
        label: "Подбор по автомобилю: марка, год, модель, тип двигателя"
        tall: true
      - file: japan-shina-modal-02-by-size
        label: Подбор по размеру шины
        tall: true
      - file: japan-shina-modal-03-support
        label: Форма технической поддержки
        tall: true


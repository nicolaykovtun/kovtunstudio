keywords: упаковка, этикетка, дизайн-система линейки, аккумуляторы, АКБ, Alaska, Аляска, AGM, EFB, CMF, МСМ ГРУПП, Николай Ковтун

resultTitle: Что дает такая система
resultIntro: >-
  Линейка выросла с одной серии до трех и с горстки позиций до 37, а этикетка
  осталась той же. Новая позиция собирается подстановкой чисел в готовые зоны,
  поэтому расширение ассортимента не превращается в переделку всей упаковки.

ctaTitle: Линейка растет, а упаковка сыпется?
ctaText: >-
  Расскажите, сколько позиций в ассортименте и куда он растет. Соберу систему
  упаковки, которая примет новые позиции без пересборки макета.
ctaButton: Обсудить упаковку линейки

compare:
  title: Было и стало
  intro: >-
    Слева упаковка, с которой линейка жила до редизайна, справа — новая.
    Одна и та же позиция, CMF 40 на 42B19.
  items:
    - number: '01'
      title: Ампераж вышел вперед, красное поле ушло в синие горы
      text: >-
        На старой коробке первым читался медведь, а ампераж прятался в подписи
        мелким кеглем: чтобы узнать емкость, покупатель брал коробку в руки.
        В новой упаковке 40 Ah набрано самым крупным кеглем макета и стоит
        сразу под знаком, а низ занял синий горный массив — он же держит
        и коробку, и этикетку на корпусе.
      before: alaska-compare-01-before
      after: alaska-compare-02-after
      beforeAlt: Старая коробка и аккумулятор Alaska в красно-белом оформлении
      afterAlt: Новая коробка и аккумулятор Alaska с крупным амперажом и синими горами
      beforeCaption: Упаковка / до
      afterCaption: Упаковка / после

groups:
  - id: system
    title: Как устроена этикетка
    # Сборки вертикальные, 2160x3840 — ровно 9:16. Плитку задаем под картинку,
    # иначе в штатных 4:5 обрезается низ с рядом из трех серий.
    layout: tall
    ratio: 9 / 16
    intro: >-
      Зоны на этикетке закреплены: знак, набор технологий, ключевой показатель
      и имя продукта. Дальше в эти зоны подставляются числа конкретной позиции,
      а различает серии цвет числа и рисунок горы.
    items:
      - file: alaska-system-01-anatomy
        label: Разбор зон этикетки и три серии в одном ряду
      - file: alaska-system-02-series
        label: CMF, EFB и AGM — три серии на аккумуляторах

  - id: labels
    title: Лицевые этикетки и верхние наклейки
    layout: slides
    intro: >-
      Каждая позиция линейки печатается в своем размере, поэтому этикетки
      разной формы — от почти квадратной у малых емкостей до длинной ленты
      у грузовых. Сетка при этом одна, меняется только ширина зон. Кроме лицевой
      у каждой позиции есть верхняя наклейка на крышку. Она повторяет знак, ампераж,
      артикул и гору, и добавляет предупреждения об опасности на двух языках —
      их место в макете заложено сразу, слева и справа от логотипа.
    items:
      - file: alaska-label-01-cmf
        label: CMF 50 L — красное число и плоские скалы
      - file: alaska-label-02-efb
        label: EFB N55 L — оранжевое число и рассветный хребет
      - file: alaska-label-03-agm
        label: AGM 75 L — синее число и заснеженный пик
      - file: alaska-label-04-cmf-big
        label: CMF 190 L — грузовая позиция на длинной этикетке
      - file: alaska-label-05-efb-small
        label: EFB M42 L — та же сетка на малой емкости
      - file: alaska-label-06-agm-small
        label: AGM 45 L — компактный формат серии AGM
      - file: alaska-label-07-top-cmf
        label: Верхняя наклейка CMF 50 L
      - file: alaska-label-08-top-agm
        label: Верхняя наклейка AGM 75 L

  - id: boxes
    title: Коробки
    layout: slides
    intro: >-
      Коробка собрана из тех же зон, что этикетка, и повторяет ее на четырех
      гранях сразу. Служебные панели со штрихкодом, знаками обращения
      и предупреждениями вынесены в свои поля и не спорят с лицевой стороной.
    items:
      - file: alaska-box-01-cmf-40
        label: Развертка коробки CMF 40 L
      - file: alaska-box-02-cmf-50
        label: Развертка коробки CMF 50 L
      - file: alaska-box-03-cmf-65
        label: Развертка коробки CMF 65 FL
      - file: alaska-box-04-cmf-95
        label: Развертка коробки CMF 95 FL

  - id: ad
    title: Горы с этикеток в рекламе бренда
    layout: slides
    intro: >-
      Гора с этикетки AGM — тот самый пик, что стоит на рекламном кадре.
      Иллюстрацию для упаковки я генерировал в нейросети, а потом из нее же
      собрали реалистичную сцену для баннеров и ролика. Разбор этой цепочки —
      в отдельной статье.
    items:
      - file: alaska-ad-01-photo
        label: Реалистичная сцена, выросшая из горы с этикетки AGM
      - file: alaska-ad-02-banner
        label: Рекламный баннер серии AGM


related:
  title: Часть комплексной работы
  intro: >-
    Для Трубоварни Еремеевой я сделал не только сайт. Сначала были знак
    и правила к нему, и уже по ним собран дизайн страниц: желтый и темно-синий
    на сайте взяты из палитры гайдбука, а не подобраны заново.
  items:
    - slug: identity-trubovarnya
      label: Фирменный стиль
      text: Логотип в пяти исполнениях и гайдбук на 8 страниц с правилами для печати.

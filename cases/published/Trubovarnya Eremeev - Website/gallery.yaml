keywords: дизайн сайта, монтаж систем отопления, вайрфреймы, Трубоварня Еремеева, Руза, Николай Ковтун

resultTitle: Что дает такая структура
resultIntro: >-
  Отопление под ключ идет четырьмя шагами: техническое задание, смета и договор, монтаж с
  пусконаладкой, гарантийный сервис. Заказчик пускает монтажников в свой дом, поэтому
  доверие приходится набирать на странице, до звонка.

ctaTitle: Нужен сайт, который растет без дизайнера?
ctaText: >-
  Расскажите, что за услуги и как часто появляются новые. Посмотрю, какие блоки
  должны повторяться, чтобы сайт можно было дополнять самому.
ctaButton: Обсудить сайт

compare:
  title: Как схемы превращались в дизайн
  intro: >-
    Порядок блоков и формулировки согласовали на вайрфреймах, поэтому спорные
    места правились на схемах. Слева вайрфрейм, справа готовый макет.
  items:
    - number: '01'
      title: Первый экран остался в том же порядке
      text: >-
        На схеме проверяли последовательность: заголовок, обещание, три слова
        об услугах, две кнопки. В дизайне место под картинку занял рендер
        котельной, а фон стал желтым — порядок не поменялся.
      before: trubovarnya-wireframe-01-hero
      after: trubovarnya-home-01-hero
      beforeAlt: Вайрфрейм первого экрана сайта Трубоварни Еремеевой
      afterAlt: Готовый дизайн первого экрана на желтом фоне
    - number: '02'
      title: Цифры о компании встали рядом с рассказом
      text: >-
        Пятьсот проектов, десять лет работы и пять сотрудников стоят в одной
        строке с текстом «Кто мы», а не отдельным блоком ниже. В дизайне цифры
        получили желтый цвет и стали самым крупным элементом блока.
      before: trubovarnya-wireframe-02-about
      after: trubovarnya-home-02-about
      beforeAlt: Вайрфрейм блока «Кто мы» с фотографией и тремя показателями
      afterAlt: Готовый дизайн блока «Кто мы» с фотографией бригады и цифрами
    - number: '03'
      title: Карточки услуг подняли на желтую подложку
      text: >-
        Четыре услуги стоят в ряд одинаковыми карточками: иконка, заголовок,
        перечень работ, кнопка. В дизайне под ряд ушла желтая подложка,
        и светлые карточки отделились от нее без единой рамки.
      before: trubovarnya-wireframe-03-services
      after: trubovarnya-home-03-services
      beforeAlt: Вайрфрейм блока из четырех карточек услуг
      afterAlt: "Готовый дизайн блока услуг: светлые карточки на желтой подложке"
    - number: '04'
      title: Этапы работы выстроили лесенкой
      text: >-
        Четыре шага — от технического задания до гарантийного обслуживания —
        идут карточками со смещением вниз. Сдвиг задает направление чтения,
        поэтому нумерация 01–04 работает как маршрут, а не как список.
      before: trubovarnya-wireframe-05-process
      after: trubovarnya-home-05-process
      beforeAlt: Вайрфрейм блока «Этапы работы» из четырех карточек
      afterAlt: Готовый дизайн блока «Этапы работы» с карточками лесенкой


resultTitle: Что собрано в итоге

ctaTitle: Продаете доступ, а не разовую услугу?
ctaText: >-
  Расскажите, какие форматы у вас есть и чем они отличаются друг от друга.
  Посмотрю, как разложить их по карточкам и окнам заявки, чтобы гость выбирал
  сам, не звоня за уточнениями.
ctaButton: Обсудить сайт

compare:
  title: Как схемы превратились в дизайн
  intro: >-
    Структуру и текст согласовали на вайрфреймах. Три страницы из пяти в дизайне
    совпали со схемой по высоте до пикселя — геометрия не менялась. Слева
    вайрфрейм, справа готовый макет.
  items:
    - number: '01'
      title: Первый экран получил кадр вместо заглушки
      text: >-
        На схеме фон занимала серая плашка с пометкой, какой кадр нужен:
        «главное атмосферное фото — бассейн / природа / пространство».
        Надзаголовок, заголовок, лид и две кнопки — «Забронировать день в клубе»
        и «Стать резидентом» — перешли в дизайн без правок.
      before: eon-wireframe-01-hero
      after: eon-home-01-hero
      beforeAlt: Вайрфрейм первого экрана EON с серой заглушкой вместо фотографии
      afterAlt: Готовый дизайн первого экрана EON на фоне тропического леса
    - number: '02'
      title: Пояснение справа от заголовка сняли
      text: >-
        На схеме у раздела «О клубе» справа стоял абзац о том, для кого создан
        EON. В дизайне его нет: раздел открывается меткой, заголовком и сразу
        тремя кадрами, а роль пояснения взяли подписи на этих кадрах. Так же
        поступили с четырьмя другими разделами главной.
      before: eon-wireframe-02-about
      after: eon-home-02-about
      beforeAlt: Вайрфрейм раздела «О клубе» с поясняющим абзацем справа от заголовка
      afterAlt: "Готовый дизайн раздела «О клубе»: три кадра с подписями без пояснения справа"
    - number: '03'
      title: Цены переехали с серой плашки в зелень
      text: >-
        Четыре карточки, порядок, суммы, метки сроков и списки включенного
        на схеме и в макете совпадают. Поменялась только среда: серая подложка
        стала кадром растений, а карточки — светлыми поверх него. Блок цен
        читается одинаково на обеих подложках.
      before: eon-wireframe-05-prices
      after: eon-home-05-prices
      beforeAlt: Вайрфрейм блока цен из четырех карточек на серой подложке
      afterAlt: "Готовый дизайн блока цен: светлые карточки на кадре тропических растений"

groups:
  - id: home
    title: Главная страница, блок за блоком
    intro: >-
      Главная страница по порядку прокрутки — от первого экрана до подвала.
      Плашка «Day Pass · 2 500» вынесена к правому краю отдельным элементом
      и не привязана к блоку цен.
    items:
      - file: eon-home-01-hero
        label: Первый экран, два входа в клуб и меню из шести разделов
      - file: eon-home-02-about
        label: О клубе — осознанность, природа, качество
      - file: eon-home-03-spaces
        label: Шесть пространств клуба от кухни до Auto SPA
      - file: eon-home-04-lounge
        label: Восемь форматов лаунж-мест у бассейна с вместимостью
      - file: eon-home-05-prices
        label: Как стать гостем клуба — день, месяц, полгода, год
      - file: eon-home-06-family
        label: Семья и друзья — что в клубе есть для детей
      - file: eon-home-07-map
        label: Схема территории клуба
      - file: eon-home-08-life
        label: Гастрономия и жизнь клуба — событие недели и расписание
      - file: eon-home-09-gallery
        label: Фотогалерея «EON в деталях»
      - file: eon-home-10-footer
        label: Отзывы гостей, полоса заявки и подвал с контактами

  - id: pages
    title: Внутренние страницы
    intro: >-
      Четыре страницы целиком. Бронирование показано в двух состояниях:
      со свернутым счетчиком гостей и с раскрытым — взрослые и дети считаются
      отдельно.
    items:
      - file: eon-page-01-booking
        label: Бронирование — Day Pass или стол в ресторане
      - file: eon-page-02-guests
        label: То же окно с раскрытым счетчиком гостей
      - file: eon-page-03-archive
        label: События и новости — архив с фильтром по типу
      - file: eon-page-04-post
        label: Страница новости об открытии Clay SPA
      - file: eon-page-05-event
        label: Страница события с ценой, формой и остатком мест

  - id: membership
    title: Одно окно членства, три формата
    intro: >-
      Табы «Ежемесячно / Полугодовое / Годовое» переключают цену, список
      включенного и строку «Итого к оплате» внутри одного окна.
    layout: tall
    ratio: 1520 / 1794
    items:
      - file: eon-membership-01-month
        label: Ежемесячное членство — 8 900 батов
      - file: eon-membership-02-half
        label: Полугодовое членство — 32 000 батов
      - file: eon-membership-03-year
        label: Годовое членство — 79 000 батов и зона only adults

  - id: popups
    title: Еще три окна — день, подарок, подтверждение
    intro: >-
      Day Pass держит цену и состав на бордовой панели рядом с формой.
      Спецпредложение просит только почту. Подтверждение обещает ответ
      в течение часа.
    layout: screens
    items:
      - file: eon-popup-01-daypass
        label: Окно Day Pass — что входит в один день и форма заявки
      - file: eon-popup-02-offer
        label: Спецпредложение — десять бесплатных Day Pass за почту
      - file: eon-popup-03-sent
        label: Экран «Заявка получена»

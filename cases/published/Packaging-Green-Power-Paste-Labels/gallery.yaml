# Раскладка изображений кейса. Пути строятся из имени файла:
# full/<file>.webp и thumb/<file>-thumbnail.webp внутри assetRoot.
# Картинки собираются скриптом docs/tools/label-measure/make-juice-paste-images.cjs
assetRoot: /assets/cases/labels-green-power-paste

cover:
  # Кадр magnific_img1-5_u5Hcf0vQLD, выбран Николаем. Шаблон режет обложку
  # в 16:9 с object-fit: cover, поэтому кадрируем заранее.
  src: green-power-paste-cover.webp
  alt: Пять банок ореховой пасты Green Power в ряд, от арахисовой до фисташковой

og: green-power-paste-cover.webp
ogAlt: Ореховые пасты Green Power, пять видов в банках 150 г

keywords: дизайн этикетки, этикетка для банки, ореховая паста, упаковка продуктов питания, маркировка ТР ТС 022/2011, Green Power, Владивосток, Николай Ковтун

resultTitle: Что система дала линейке

ctaTitle: Вся маркировка не помещается на одну этикетку?
ctaText: >-
  Расскажите, какая тара, сколько видов и сколько обязательного текста нужно
  разместить. Разложу маркировку так, чтобы она встала в допустимом кегле,
  а лицо продукта осталось лицом, а не остатком площади.
ctaButton: Обсудить дизайн этикетки

groups:
  - id: jars
    title: Пять банок целиком
    # Рендеры отданы как есть, без кропа: по бокам банки видны «ушки» —
    # плоские фланги этикетки, которые на реальной упаковке уходят за бок.
    layout: screens
    ratio: 2400 / 1792
    intro: >-
      Каждая банка с «ушками»: по бокам лежат те самые фланги, где стоит
      обязательный текст. На витрине они заворачиваются за бок, а спереди
      остается только лицо с фотографией сырья.
    items:
      - file: green-power-paste-jar-01-arahisovaya
        label: Арахисовая
      - file: green-power-paste-jar-02-keshyu
        label: Кешью
      - file: green-power-paste-jar-03-mindalnaya
        label: Миндальная
      - file: green-power-paste-jar-04-podsolnechnaya
        label: Подсолнечная
      - file: green-power-paste-jar-05-fistashkovaya
        label: Фисташковая

  - id: flat
    title: Пять разверток целиком
    # Лента 100×40 мм, файл 885x375. Раскладка brochure: в ней у плитки нет
    # сброса grid-column, базовый span 6 упирается в три колонки, и каждая
    # развертка встает во всю ширину. Для ленты 1:2,4 это единственный способ
    # показать ее читаемой — в три колонки текст на флангах превращается в шум.
    layout: brochure
    ratio: 885 / 375
    intro: >-
      Слева добровольное: абзац о свойствах, штрихкод, знак EAC, поле даты
      производства и знак «без ГМО». В середине лицо — фотография сырья во всю
      высоту, знак, название и масса нетто. Справа обязательное: пищевая
      ценность, состав с аллергеном, срок годности, хранение, изготовитель,
      QR и горячая линия. На банке фланги уходят за бок, лицо остается спереди.
    items:
      - file: green-power-paste-flat-01-arahisovaya
        label: Арахисовая, 150 г
      - file: green-power-paste-flat-02-keshyu
        label: Кешью, 150 г
      - file: green-power-paste-flat-03-mindalnaya
        label: Миндальная, 150 г
      - file: green-power-paste-flat-04-podsolnechnaya
        label: Подсолнечная, 150 г
      - file: green-power-paste-flat-05-fistashkovaya
        label: Фисташковая, 150 г

  - id: lineup
    title: Линейка на столе
    # Одиночная плитка во всю ширину: в slides у figure:only-child span 12.
    layout: slides
    ratio: 2400 / 1340
    intro: >-
      Пять банок рядом. Фактура сырья на лице работает как цвет у соков:
      арахис, кешью, миндаль, семечки и фисташки различаются раньше, чем
      читается название.
    items:
      - file: green-power-paste-lineup
        label: Пять ореховых паст, линейка в кадре

related:
  title: Та же система, соседние линейки
  intro: >-
    Паста, масло и соки рисовались одновременно как одна система. Знак,
    постоянные строки и круглые печати у них общие, а обязательный текст
    разложен по-разному — под каждую упаковку свой прием.
  items:
    - slug: labels-green-power-oil
      label: Этикетки масла
      text: '16 видов в двух форматах бутылки: обязательное в левой колонке и нижней полосе.'
    - slug: labels-green-power-juice
      label: Этикетки соков
      text: '19 вкусов в формате 42×76 мм: обязательное целиком унесено на оборот.'
    - slug: identity-green-power
      label: Фирменный стиль
      text: Знак-дерево, пять исполнений, гайдбук на 8 страниц и знаки для этикетки.

resultTitle: Что читается на странице до заявки

ctaTitle: Продаёте не товар, а доходность?
ctaText: >-
  Расскажите, из чего складывается доход вашего покупателя и что он получит
  после сделки. Посмотрю, какие блоки закроют денежные вопросы до звонка.
ctaButton: Обсудить лендинг

compare:
  title: Как схема превращалась в дизайн
  intro: >-
    Порядок блоков и тексты согласовали на вайрфрейме, поэтому спорные места
    правились на схеме. Слева вайрфрейм, справа готовый макет.
  items:
    - number: '01'
      title: Первый экран заговорил обещаниями
      text: >-
        На схеме первый экран держал только заголовок, подзаголовок и кнопку
        «Подробнее». В дизайне под ним появилась фотография строящегося
        комплекса с четырьмя выносками — гарантированный доход, юридическое
        сопровождение, рассрочка и пакет «Всё включено», — а кнопка стала
        «Оставить заявку». В шапке добавились три строки о том, чем компания
        занимается: строительство, управление, аренда.
      before: evg-wireframe-01-hero
      after: evg-landing-01-hero
      beforeAlt: Вайрфрейм первого экрана лендинга EVG Group с кнопкой «Подробнее»
      afterAlt: Готовый дизайн первого экрана с фотографией комплекса и четырьмя выносками
    - number: '02'
      title: В карточку проекта добавили деньги
      text: >-
        На схеме карточка кондоминиума Calypso Condo описывала дом словами
        и давала три параметра: район, год сдачи и время до пляжа. В дизайне
        карточка показывает Pandora Residences и держит уже шесть строк —
        площадь, стоимость, доходность в процентах и батах, район, год сдачи
        и путь до пляжа, — а под ними встала кнопка «Подробнее». Место
        плейсхолдера под видео заняли пять фотографий и карта с точкой объекта.
      before: evg-wireframe-02-projects
      after: evg-landing-02-projects
      beforeAlt: Вайрфрейм блока проектов с карточкой Calypso Condo и плейсхолдером видео
      afterAlt: Готовый дизайн блока проектов с карточкой Pandora Residences, фотографиями и картой
    - number: '03'
      title: Блок про перелёт получил самолёт
      text: >-
        На схеме «Вернём деньги за перелёт» — заголовок, абзац и маленький
        квадрат под картинку по центру. В дизайне блок занял целый экран неба:
        самолёт в ливрее EVG внутри оранжевой рамки, логотип в правом верхнем
        углу, а текст ушёл под заголовок и стал мельче.
      before: evg-wireframe-06-flight
      after: evg-landing-06-flight
      beforeAlt: Вайрфрейм блока «Вернём деньги за перелёт» с плейсхолдером картинки
      afterAlt: Готовый дизайн блока с самолётом в ливрее EVG на фоне неба
    - number: '04'
      title: Полосу фотографий переставили выше
      text: >-
        На схеме за блоком «Бесплатное проживание» шла полоса из четырёх
        картинок. В дизайне порядок поменяли: сначала четыре фотографии уже
        сданного кондоминиума Calypso, потом сам блок — и он перестал быть
        серым прямоугольником с плейсхолдером, а стал фотографией бассейна
        во всю ширину с текстом поверх.
      before: evg-wireframe-08-free-stay
      after: evg-landing-09-free-stay
      beforeAlt: Вайрфрейм блока «Бесплатное проживание» с плейсхолдером картинки
      afterAlt: Готовый дизайн блока «Бесплатное проживание» на фотографии бассейна


resultTitle: Что дает одна страница

ctaTitle: Нужен лендинг под продукт, который надо объяснять?
ctaText: >-
  Расскажите, что продаете и чего покупатель про это не знает. Соберу структуру
  и тексты на вайрфрейме, а дизайн нарисую уже по согласованной схеме.
ctaButton: Обсудить сайт

compare:
  title: Как схема превращалась в дизайн
  intro: >-
    Вайрфрейм нарисован в том же фрейме, что дизайн, и тексты в нем уже финальные,
    поэтому пары сходятся блок в блок. Слева вайрфрейм, справа готовый макет.
  items:
    - number: '01'
      title: Первый экран остался в том же порядке
      text: >-
        На схеме проверяли последовательность: название, обещание, подзаголовок
        и одна кнопка слева, картинка справа. В дизайне место под картинку заняла
        композиция из масел, соков и фруктов, а фон стал салатовым — порядок
        не поменялся.
      before: green-power-wireframe-01-hero
      after: green-power-home-01-hero
      beforeAlt: Вайрфрейм первого экрана сайта Green Power с заглушкой под картинку
      afterAlt: Готовый дизайн первого экрана на салатовой плашке с продуктами
    - number: '02'
      title: Шесть линеек встали одинаковыми карточками
      text: >-
        Два ряда по три карточки, в каждой одно и то же: место под фотографию,
        плашка с ассортиментом, описание и кнопка заказа. Тексты про микрозелень
        и витграсс написаны еще на схеме — в дизайне к ним добавились только
        фотографии продукта.
      before: green-power-wireframe-03-products
      after: green-power-home-03-products
      beforeAlt: Вайрфрейм блока из шести карточек продуктовых линеек
      afterAlt: Готовый дизайн блока продуктов с фотографиями масел, соков и муки
    - number: '03'
      title: Два блока связали желтой лентой
      text: >-
        Преимущества и технологии производства на схеме стоят двумя отдельными
        блоками. В дизайне они остались на своих местах, но их прошила желтая
        лента, а под технологии ушла салатовая подложка — два блока читаются
        как один рассказ о качестве.
      before: green-power-wireframe-04-advantages
      after: green-power-home-04-advantages
      beforeAlt: Вайрфрейм блоков преимуществ и технологий производства
      afterAlt: Готовый дизайн блоков преимуществ и технологий с желтой лентой
    - number: '04'
      title: Заглушку занял сам бот
      text: >-
        На схеме на месте картинки стоит серый прямоугольник: сначала
        договорились, что в блоке будет одно изображение и одна кнопка.
        В дизайне его занял коллаж экранов бота — каталог, карточка товара,
        корзина с итогом и история заказов.
      before: green-power-wireframe-06-telegram
      after: green-power-home-06-telegram
      beforeAlt: Вайрфрейм блока заказа через Телеграм-бот с заглушкой под картинку
      afterAlt: Готовый дизайн блока заказа с коллажем экранов Телеграм-бота


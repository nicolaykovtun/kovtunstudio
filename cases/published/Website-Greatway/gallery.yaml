# Раскладка изображений кейса. Пути в full/ и thumb/ строятся из имени файла:
# full/<file>.webp и thumb/<file>-thumbnail.webp внутри assetRoot.
assetRoot: /assets/cases/website-greatway

cover:
  src: greatway-cover.webp
  alt: Первый экран сайта Greatway с заголовком «Профессиональные грузоперевозки любой сложности для вашего бизнеса»

og: greatway-cover.webp
ogAlt: Главная страница сайта транспортной компании Greatway

keywords: дизайн сайта транспортной компании, грузоперевозки, экспедирование, доставка из Китая, Greatway, Владивосток, Николай Ковтун

resultTitle: Что даёт такая сборка
resultIntro: >-
  У грузоперевозки нет витрины: ни фотографии товара, ни прайса. Точную цену без веса,
  объёма и маршрута не назвать, поэтому вместо цены на страницах стоит короткий способ её
  узнать.

ctaTitle: Продаёте услугу, у которой нет прайса?
ctaText: >-
  Расскажите, из чего у вас складывается цена и какие параметры нужны, чтобы её
  посчитать. Посмотрю, где на страницах должна стоять форма и что писать
  вместо цифры.
ctaButton: Обсудить сайт

groups:
  - id: home
    title: Главная, блок за блоком
    intro: "Девять блоков в порядке прокрутки: от первого экрана до подвала."
    items:
      - file: greatway-home-01-hero
        label: Первый экран с тремя обещаниями и кнопкой расчёта стоимости
      - file: greatway-home-02-clients
        label: Восемь логотипов постоянных клиентов
      - file: greatway-home-03-services
        label: Шесть услуг карточками, у каждой своя страница
      - file: greatway-home-04-route
        label: Обязанности экспедитора списком и карта маршрута
      - file: greatway-home-05-china
        label: Сборные контейнеры из Китая, склад в Шанхае и контейнерные линии
      - file: greatway-home-06-partners
        label: Восемь логотипов партнёров
      - file: greatway-home-07-transport
        label: Пять видов перевозок, каждый открывает модальное окно
      - file: greatway-home-08-calc
        label: Форма расчёта стоимости перевозки на оранжевой подложке
      - file: greatway-home-09-footer
        label: Полоса консультации, подвал с услугами и адресом

  - id: pages
    title: Страницы сайта
    intro: >-
      Десять страниц целиком: шесть услуг, направления, список проектов,
      карточка проекта и контакты. У каждой услуги форма расчёта стоит
      в первом экране.
    items:
      - file: greatway-page-01-containers
        label: "Перевозка контейнеров: преимущества, склад в Шанхае, контейнерные линии"
      - file: greatway-page-02-groupage
        label: Перевозка сборных грузов от одного кубического метра
      - file: greatway-page-03-oversized
        label: Перевозка негабаритных грузов и шесть видов таких грузов
      - file: greatway-page-04-bulk
        label: Перевозки сыпучих и навалочных грузов, четыре группы грузов
      - file: greatway-page-05-china
        label: "Агентские услуги в Китае: поиск товара, сделки, представительство"
      - file: greatway-page-06-ship-agency
        label: Судовое агентирование под российским и иностранными флагами
      - file: greatway-page-07-directions
        label: Направления грузоперевозок картой Азиатско-Тихоокеанского региона
      - file: greatway-page-08-projects
        label: Список проектов карточками с заказчиком, маршрутом и весом
      - file: greatway-page-09-project
        label: "Страница проекта: задача, решение, фотографии и форма расчёта"
      - file: greatway-page-10-contacts
        label: Контакты, график работы и карта Владивостока

  - id: modals
    title: Модальные окна
    layout: tall
    ratio: 2128 / 1528
    intro: >-
      Пять видов перевозок не заняли отдельных страниц: каждый открывается
      окном с описанием, преимуществами и формой обратного звонка. Шестое
      окно — форма расчёта маршрута, восемь полей в трёх группах.
    items:
      - file: greatway-modal-01-road
        label: Автомобильные перевозки
      - file: greatway-modal-02-rail
        label: Железнодорожные грузоперевозки
      - file: greatway-modal-03-sea
        label: Морские и речные грузоперевозки
      - file: greatway-modal-04-air
        label: Авиаперевозки
      - file: greatway-modal-05-multimodal
        label: Мультимодальные грузоперевозки
      - file: greatway-modal-06-calc
        label: Форма расчёта стоимости маршрута

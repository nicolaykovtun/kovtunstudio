ctaTitle: Продаете установку, а не коробку?
ctaText: >-
  Расскажите, из чего складывается цена и кто выезжает к клиенту. Посмотрю,
  какие блоки закроют вопросы про деньги и про людей до звонка.
ctaButton: Обсудить лендинг

compare:
  title: Как схема превращалась в дизайн
  intro: >-
    Порядок блоков и тексты согласовали на вайрфрейме, поэтому спорные места
    правились на схеме. Слева вайрфрейм, справа готовый макет.
  items:
    - number: '01'
      title: Пять возможностей переставили в две строки
      text: >-
        На схеме пять пунктов о том, чем можно управлять, стояли одной строкой
        и жались по ширине. В дизайне они встали в две строки — три сверху,
        два снизу, — а место под картинку занял дом с телефоном в руке.
        Надкатегорию «Система ectoControl» подняли желтым.
      before: ektostroy-wireframe-01-hero
      after: ektostroy-landing-01-hero
      beforeAlt: Вайрфрейм первого экрана лендинга «Эктострой»
      afterAlt: Готовый дизайн первого экрана с частным домом и телефоном в руке
    - number: '02'
      title: Вопрос в заголовке заменили обещанием
      text: >-
        На схеме блок со схемой дома звался «Зачем нужен EctoControl?».
        В дизайне заголовок стал «Одна система – множество решений!»: вместо
        вопроса читателю сразу дается ответ. Сама схема с двенадцатью
        подписями не поменялась.
      before: ektostroy-wireframe-02-system
      after: ektostroy-landing-02-system
      beforeAlt: Вайрфрейм блока со схемой дома и подписями возможностей
      afterAlt: Готовый дизайн блока со схемой дома и двенадцатью подписями
    - number: '03'
      title: Блок о монтаже сжали и переписали
      text: >-
        На схеме было два подблока: «Профессиональный монтаж систем EctoControl»
        и отдельная «Установка оборудования „ПОД КЛЮЧ“» с двумя абзацами.
        В дизайне остался один заголовок «Монтаж – это наша работа!»,
        а второй подблок свернулся в одну желтую строку про 400 проектов.
      before: ektostroy-wireframe-06-montage
      after: ektostroy-landing-06-montage
      beforeAlt: Вайрфрейм блока о монтаже с двумя подблоками и картой проектов
      afterAlt: Готовый дизайн блока о монтаже со строкой про 400 проектов и картой Москвы
    - number: '04'
      title: Видеообзоров стало три, площадок — три
      text: >-
        На схеме стояли два пустых кадра под видео и две площадки — forumhouse
        и Яндекс Карты. В дизайне видео стало три, с названиями блогов
        под каждым, и добавилось приложение в Google Play. Заголовок справа
        сменился с «Мы подобрали видеообзоры» на «Это подтверждают известные
        блогеры на YouTube».
      before: ektostroy-wireframe-08-reviews
      after: ektostroy-landing-08-reviews
      beforeAlt: Вайрфрейм блока отзывов с двумя кадрами под видео
      afterAlt: Готовый дизайн блока отзывов с тремя видеообзорами и тремя площадками


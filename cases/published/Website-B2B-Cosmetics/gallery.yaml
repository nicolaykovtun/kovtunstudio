    items:
      - file: b2b-home-01-hero
        label: Первый экран, пять брендов и четыре преимущества
      - file: b2b-home-02-why
        label: "Почему именно китайская: спрос, цена, упаковка"
      - file: b2b-home-03-audience
        label: Пять аудиторий — от розничных точек до начинающих предпринимателей
      - file: b2b-home-04-earnings
        label: "Сколько можно заработать: розничная цена против оптовой"
      - file: b2b-home-05-documents

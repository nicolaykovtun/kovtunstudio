resultTitle: Что дал такой дизайн

ctaTitle: Нужен сайт, который продает оптом?
ctaText: >-
  Расскажите, что продаете и кому перепродают дальше. Посмотрю, из каких блоков
  собрать страницу и чем закрыть вопрос о заработке покупателя.
ctaButton: Обсудить сайт

compare:
  title: Что изменилось между прототипом и дизайном
  intro: >-
    Порядок блоков и тексты пришли от заказчика, поэтому в дизайне менялась
    подача, а не структура. Слева прототип, справа готовый макет.
  items:
    - number: '01'
      title: Первый экран получил диагональ
      text: >-
        На схеме это серая плашка: заголовок, кнопка «Запросить прайс лист»
        и названия брендов строкой. В дизайне правую половину заняла фотография
        под диагональным срезом, названия брендов встали в рамку собственными
        логотипами, а четыре преимущества получили иконки.
      before: b2b-wireframe-01-hero
      after: b2b-home-01-hero
      beforeAlt: Прототип первого экрана сайта B2B Cosmetics
      afterAlt: Готовый дизайн первого экрана сайта B2B Cosmetics
    - number: '02'
      title: Пять аудиторий стали фотокарточками
      text: >-
        В прототипе это пять белых прямоугольников с текстом. В дизайне под
        каждым лежит затемненная фотография, а карточка «Интернет магазины»
        залита красным — одна из пяти выделена, остальные приглушены.
      before: b2b-wireframe-03-audience
      after: b2b-home-03-audience
      beforeAlt: Прототип блока «Кому подойдет косметика из Китая»
      afterAlt: Готовый дизайн блока с пятью аудиториями на фотокарточках
    - number: '03'
      title: Условия поставки собрались в ряд с иконками
      text: >-
        Четыре условия стояли на сером фоне схемы в две строки. В дизайне они
        выстроились в один ряд с иконками в кругах, а отсылка к разделу
        «Доставка и оплата» из строки текста с кнопкой стала красной плашкой.
      before: b2b-wireframe-06-terms
      after: b2b-home-06-terms
      beforeAlt: Прототип блока условий поставки
      afterAlt: Готовый дизайн блока условий поставки с иконками и красной плашкой
    - number: '04'
      title: Зигзаг из полос стал сеткой цветных карточек
      text: >-
        В схеме пять брендов идут пятью полосами в шахматном порядке. В дизайне
        это сетка два — два — один: каждая карточка залита фирменным цветом
        бренда, на ней логотип и фотография упаковки.
      before: b2b-wireframe-08-brands
      after: b2b-home-08-brands
      beforeAlt: Прототип блока «Узнайте больше о брендах»
      afterAlt: Готовый дизайн блока брендов из пяти цветных карточек

groups:

keywords: дизайн сайта, лендинг, UX/UI, металлоконструкции, промышленное производство, строительные конструкции, ПТК Стройконструкция, Владивосток, Николай Ковтун

resultTitle: Что получила компания
resultIntro: >-
  Компания ведет металлоконструкции полным циклом: от КМД и собственного производства до
  доставки и монтажа. Четыре направления отличаются продуктом и сроками, а для крупного
  строительного заказа одной кнопки заявки недостаточно.

ctaTitle: Нужен сайт для сложной B2B-услуги?
ctaText: >-
  Разложу длинный цикл работ на понятные блоки, отделю быстрый вопрос от заявки
  с документацией и соберу страницу, по которой подрядчика можно оценить до звонка.
ctaButton: Обсудить сайт


# Раскладка изображений кейса. Пути в full/ и thumb/ строятся из имени файла:
# full/<file>.webp и thumb/<file>-thumbnail.webp внутри assetRoot.
assetRoot: /assets/cases/identity-green-power

cover:
  src: green-power-identity-cover.webp
  alt: Обложка гайдбука Green Power — знак-дерево на листьях базилика

og: green-power-identity-cover.webp
ogAlt: Гайдбук по фирменному стилю Green Power

keywords: фирменный стиль, логотип, гайдбук, брендбук, знаки для этикетки, сыродавленные масла, здоровое питание, Green Power, Владивосток, Николай Ковтун

resultTitle: Что знак дает на носителях

ctaTitle: Нужен знак, который переживет и этикетку, и кузов?
ctaText: >-
  Расскажите, где будет жить знак: этикетка, упаковка, транспорт, сайт. Соберу
  исполнения под каждый носитель и запишу параметры печати так, чтобы типография
  не переспрашивала.
ctaButton: Обсудить знак и гайдбук

groups:
  - id: logo
    title: Знак и пять исполнений
    # Исполнения сняты карточками с 3-й страницы гайдбука, 890x1001: в tall
    # они видны целиком и в одном масштабе. Основной вариант собран из файла
    # логотипа на белом поле того же размера, см. tmp/crop-green-power.mjs.
    # 890x1001 — это ровно 8:9, поэтому плитку задаем под картинку: в штатных
    # 4:5 знак вписывался с серыми полями сверху и снизу.
    layout: tall
    ratio: 8 / 9
    intro: >-
      Дерево с ростком в центре кроны и открытыми корнями, круговая надпись
      и монограмма из букв S и D в стволе. Рисунок держится на контуре одной
      толщины, поэтому знак одинаково работает в цвете и в одну краску.
    items:
      - file: green-power-logo-01-main
        label: Основной вариант знака
      - file: green-power-logo-02-on-dark
        label: На темно-зеленом фирменном фоне
      - file: green-power-logo-03-on-light
        label: На карамельном фирменном фоне
      - file: green-power-logo-04-mono-light
        label: Одноцветный вариант для темного фона
      - file: green-power-logo-05-mono-dark
        label: Одноцветный вариант для светлого фона

  - id: marks
    title: Знаки для этикетки
    # Файлы знаков квадратные, 550–750px, расхождение по пропорции до 1,6% —
    # плитку держим квадратной, картинка заполняет ее целиком.
    layout: tall
    ratio: 1 / 1
    intro: >-
      Происхождение и отсутствие ГМО вынесены из логотипа в самостоятельные
      круглые знаки. На борту фургона они стоят рядом с логотипом, каждый
      в своем размере.
    items:
      - file: green-power-mark-01-primorye
        label: "«Произведено в Приморье» с отметкой качества"
      - file: green-power-mark-02-primorye-open
        label: Тот же знак с открытым центром
      - file: green-power-mark-03-non-gmo
        label: "Знак «без ГМО»"

  - id: guidebook
    title: Гайдбук
    # Страницы гайдбука ровно 16:9 — в раскладке слайдов они видны целиком,
    # а левая колонка с навигацией по разделам не срезается, как было бы
    # в screens.
    layout: slides
    intro: >-
      В гайдбуке 8 страниц и четыре раздела: конструкция логотипа, колористика,
      типографика, деловая документация. Здесь шесть страниц — разворот
      с визитной карточкой не публикуем, на нем контакты соучредителя.
    items:
      - file: green-power-guidebook-01-cover
        label: Обложка руководства по фирменному стилю
      - file: green-power-guidebook-02-safe-area
        label: Охранное поле по высоте буквы G
      - file: green-power-guidebook-03-versions
        label: Цветные и монохромные исполнения знака
      - file: green-power-guidebook-04-misuse
        label: Девять недопустимых вариантов
      - file: green-power-guidebook-05-colors
        label: "Палитра: Pantone, CMYK, RGB и HEX"
      - file: green-power-guidebook-06-type
        label: Шрифтовая пара Mont и Bahnschrift

related:
  title: Сайт, собранный по этому стилю
  intro: >-
    Знак и правила к нему были первым шагом. По палитре из гайдбука собран сайт
    компании: темно-зеленый подвала и салатовый первого экрана взяты отсюда,
    а знак «Произведено в Приморье» стоит на странице в блоке «О нас».
  items:
    - slug: website-green-power
      label: Сайт
      text: Одностраничник на 12 блоков с вайрфреймом, текстами и сборкой на WordPress.
